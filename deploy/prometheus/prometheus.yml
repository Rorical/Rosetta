# One scrape target per running instance. `rosetta_instance` must equal the
# name given to rosetta-console with -instance.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: rosetta
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          rosetta_instance: arbitrum-one

  - job_name: rosetta-console
    static_configs:
      - targets: ["127.0.0.1:8788"]
